<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ehan International — Office</title><style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 18px;color:#223}a{color:#145a70}li{padding:9px;border-bottom:1px solid #ddd}input,button{padding:10px;margin:5px}</style></head><body><h1>Customers — {{ org.name }}</h1><p><a href="{% url 'office-cases' org.slug %}">Cases</a></p>{% if can_add %}<form method="post">{% csrf_token %}<input name="name" maxlength="200" placeholder="Customer name" required><input name="phone" maxlength="35" placeholder="Phone"><button>Add customer</button></form>{% endif %}<ul>{% for r in records %}<li>{{ r.name }} — {{ r.phone }}</li>{% empty %}<li>No customers</li>{% endfor %}</ul></body></html>
