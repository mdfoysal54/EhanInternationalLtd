<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff sign in</title>
<style>body{font:16px system-ui;background:#f4f6f7;color:#24313c;display:grid;place-items:center;min-height:100vh}main{background:white;padding:32px;border:1px solid #dce3e6;border-radius:12px;max-width:420px;width:90%}label{display:block;margin-top:12px}input{width:100%;padding:10px;border:1px solid #bac6ce;border-radius:6px}button{margin-top:18px;background:#176a6c;color:white;padding:12px;border:0;border-radius:6px;cursor:pointer}</style></head><body><main><h1>Ehan International Ltd</h1><p>Authorized staff sign in</p>
{% if form.errors %}<p role="alert">Invalid username or password.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Sign in</button></form></main></body></html>
